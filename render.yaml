services:
  - type: web
    name: docai-backend
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: tiny.en
      - key: WHISPER_CPU_THREADS
        value: "1"
      - key: MAX_VIDEO_SECONDS
        value: "150"
      # Hard clamp on both the advertised cap and the worker's guard. Raising MAX_VIDEO_SECONDS above this
      # no longer lets a clip through. This is deliberately below the longest run ever completed here (3:47,
      # twice) because a 2:54 clip killed a container that had just finished a 2:57 - length does not
      # predict the peak, so this is a risk choice, and lowering it is the only free-tier knob that helps.
      - key: MAX_VERIFIED_VIDEO_SECONDS
        value: "150"
      - key: WHISPER_ABORT_ANON_MB
        value: "440"
      # Measured across get_whisper_model() by the upload completion line.
      - key: WHISPER_LOAD_COST_MB
        value: "75"
      - key: WHISPER_DECODE_MB_PER_MINUTE
        value: "5"
      # Lower bound from ONE observed kill: a run read at 344MB of 512MB was then SIGKILLed inside
      # model.transcribe()'s pre-yield step, so that step needs more than the 168MB that was free.
      # Tighten it from the next death's numbers; do not treat it as a distribution.
      - key: WHISPER_PREYIELD_SPIKE_MB
        value: "170"
      - key: WHISPER_ADVERTISE_MARGIN_MB
        value: "13"
      - key: CELERY_TASK_SOFT_TIME_LIMIT
        value: "1800"
      - key: CELERY_TASK_TIME_LIMIT
        value: "2100"
