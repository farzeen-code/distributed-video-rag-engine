services:
  - type: web
    name: docai-backend
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: WHISPER_MODEL_SIZE
        value: tiny.en
      - key: WHISPER_CPU_THREADS
        value: "1"
      - key: MAX_VIDEO_SECONDS
        value: "240"
      # Hard clamp on both the advertised cap and the worker's guard. Raising MAX_VIDEO_SECONDS above this
      # no longer lets a clip through: it is the longest run this container has actually completed.
      - key: MAX_VERIFIED_VIDEO_SECONDS
        value: "240"
      - key: WHISPER_ABORT_ANON_MB
        value: "440"
      - key: WHISPER_LOAD_COST_MB
        value: "150"
      - key: WHISPER_DECODE_MB_PER_MINUTE
        value: "5"
      - key: WHISPER_ADVERTISE_MARGIN_MB
        value: "13"
      - key: CELERY_TASK_SOFT_TIME_LIMIT
        value: "1800"
      - key: CELERY_TASK_TIME_LIMIT
        value: "2100"
